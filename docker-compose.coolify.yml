name: opengym

services:
  media:
    image: alpine/git

    volumes:
      - opengym_media_img:/out/img
      - opengym_media_gif:/out/gif

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/
          cp /tmp/ds/videos/*.gif /out/gif/
          echo "Exercise media ready."
        else
          echo "Exercise media already present."
        fi

    restart: "no"

  api:
    build:
      context: ./api
      target: ${API_TARGET:-default}

    restart: unless-stopped

    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data

      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      RP_NAME: ${RP_NAME:-openGym}

      TRUST_PROXY: ${TRUST_PROXY:-1}

      SESSION_DAYS: ${SESSION_DAYS:-90}

      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-1}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}

      DEFAULT_LANG: ${DEFAULT_LANG:-es}

      AUDIT_LOG: ${AUDIT_LOG:-1}
      AUDIT_MAX: ${AUDIT_MAX:-5000}
      AUDIT_DAYS: ${AUDIT_DAYS:-90}
      AUDIT_IP: ${AUDIT_IP:-off}

      COACH_DISABLED: ${COACH_DISABLED:-}

    volumes:
      - opengym_data:/data
      - opengym_coach_auth:/coach-auth

  web:
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped

    depends_on:
      media:
        condition: service_completed_successfully

      api:
        condition: service_started

    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      BACKEND: api
      PORT: ${PORT:-3000}
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}
      BASE_PATH: ${BASE_PATH:-}
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}

    volumes:
      - opengym_media_img:/usr/share/nginx/html/img:ro
      - opengym_media_gif:/usr/share/nginx/html/gif:ro

volumes:
  opengym_data:
  opengym_coach_auth:
  opengym_media_img:
  opengym_media_gif:
