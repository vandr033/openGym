name: opengym

services:
  media:
    image: alpine/git:latest

    restart: "no"

    volumes:
      - opengym_media_img:/out/img
      - opengym_media_gif:/out/gif

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        mkdir -p /out/img /out/gif

        if [ -z "$$(ls -A /out/img 2>/dev/null)" ] || [ -z "$$(ls -A /out/gif 2>/dev/null)" ]; then
          echo "Downloading exercise media..."

          rm -rf /tmp/exercises-dataset

          git clone \
            --depth 1 \
            https://github.com/hasaneyldrm/exercises-dataset \
            /tmp/exercises-dataset

          cp /tmp/exercises-dataset/images/*.jpg /out/img/
          cp /tmp/exercises-dataset/videos/*.gif /out/gif/

          echo "Exercise media ready."
        else
          echo "Exercise media already present. Skipping download."
        fi


  api:
    build:
      context: ./api
      target: ${API_TARGET:-default}

    restart: unless-stopped

    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      SAAS_ENABLED: ${SAAS_ENABLED:-0}
      DATABASE_URL: ${SAAS_DATABASE_URL:-}

      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      RP_NAME: ${RP_NAME:-openGym}

      TRUST_PROXY: ${TRUST_PROXY:-1}

      SESSION_DAYS: ${SESSION_DAYS:-90}

      ADMIN_UIDS: ${ADMIN_UIDS:-}

      INVITE_ONLY: ${INVITE_ONLY:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-1}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-0}

      DEFAULT_LANG: ${DEFAULT_LANG:-es}

      AUDIT_LOG: ${AUDIT_LOG:-1}
      AUDIT_MAX: ${AUDIT_MAX:-5000}
      AUDIT_DAYS: ${AUDIT_DAYS:-90}
      AUDIT_IP: ${AUDIT_IP:-off}

      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      COACH_DISABLED: ${COACH_DISABLED:-}

      COACH_CODEX_HOME: /codex

    volumes:
      - opengym_data:/data
      - opengym_codex:/codex

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q \"http://127.0.0.1:$${PORT:-3000}/api/health\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  mysql:
    image: mysql:8.4
    profiles: ["saas"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opengym_saas
      MYSQL_USER: opengym
      MYSQL_PASSWORD: ${SAAS_MYSQL_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - opengym_saas_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    profiles: ["saas-migrate"]
    build:
      context: ./api
      target: migrate
    environment:
      DATABASE_URL: ${SAAS_DATABASE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy


  web:
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped

    depends_on:
      media:
        condition: service_completed_successfully

      api:
        condition: service_started

    environment:
      NGINX_PORT: ${NGINX_PORT:-80}

      BACKEND: ${BACKEND:-api}
      PORT: ${PORT:-3000}

      RESOLVER: 127.0.0.11

      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}

      BASE_PATH: ${BASE_PATH:-}

      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}

    expose:
      - "80"

    volumes:
      - opengym_media_img:/usr/share/nginx/html/img:ro
      - opengym_media_gif:/usr/share/nginx/html/gif:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q \"http://127.0.0.1:$${NGINX_PORT:-80}/\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  opengym_data:
  opengym_codex:
  opengym_media_img:
  opengym_media_gif:
  opengym_saas_mysql:
